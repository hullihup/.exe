[package]
name = "skinstudio"
version = "1.3.1"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
png = "0.18"
rfd = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
winreg = "0.56"
