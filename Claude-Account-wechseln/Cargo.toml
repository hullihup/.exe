[package]
name = "claude-account-wechsler"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = { version = "0.37", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
